name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build as a draft release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tag must be v-prefixed semantic version text: $tag"
          }
          $version = $Matches.version
          $versionPrefix = ($version -split '-', 2)[0]
          $channel = if ($version.Contains('-')) { 'preview' } else { 'stable' }
          [xml]$project = Get-Content -LiteralPath '.\Nikkiward\Nikkiward.csproj' -Raw
          $projectVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($projectVersion -ne $version) {
            throw "Release tag version '$version' does not match project version '$projectVersion'."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_prefix=$versionPrefix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Fetch verified native dependency
        shell: pwsh
        run: .\build\Fetch-Nuan5Dependency.ps1

      - name: Restore and run tests
        shell: pwsh
        run: |
          dotnet restore .\Nikkiward.ProfileBuilder.Tests\Nikkiward.ProfileBuilder.Tests.csproj
          dotnet run --project .\Nikkiward.ProfileBuilder.Tests\Nikkiward.ProfileBuilder.Tests.csproj -c Release --no-restore

      - name: Publish portable x64 app
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'nikkiward-publish'
          dotnet restore .\Nikkiward\Nikkiward.csproj -r win-x64 -p:Platform=x64 -p:Configuration=Release -p:PublishReadyToRun=true
          dotnet publish .\Nikkiward\Nikkiward.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true --no-restore -o $publishDir -p:PublishTrimmed=false -p:ContinuousIntegrationBuild=true -p:IncludeSourceRevisionInInformationalVersion=false -p:Version='${{ steps.release_meta.outputs.version }}' -p:AssemblyVersion='${{ steps.release_meta.outputs.version_prefix }}.0' -p:FileVersion='${{ steps.release_meta.outputs.version_prefix }}.0' -p:InformationalVersion='${{ steps.release_meta.outputs.version }}+${{ github.sha }}'
          Get-ChildItem -LiteralPath $publishDir -Filter *.pdb -Recurse | Remove-Item -Force
          .\build\Test-ReleasePayload.ps1 -Root $publishDir -Label 'workflow publish' -ManifestPath (Join-Path $env:RUNNER_TEMP 'nikkiward-publish.manifest.txt')

      - name: Set up Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $innoDir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $expectedHash = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup hash mismatch: $actualHash"
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Inno Setup signature is invalid: $($signature.Status)"
          }
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$innoDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }
          $iscc = Join-Path $innoDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe is missing: $iscc"
          }
          "INNO_SETUP_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package and generate manifest
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'nikkiward-release'
          $publishDir = Join-Path $env:RUNNER_TEMP 'nikkiward-publish'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $zipPath = Join-Path $releaseDir 'Nikkiward-win-x64.zip'
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
          .\build\Package-Installer.ps1 -PublishDir $publishDir -OutputDir $releaseDir -Version '${{ steps.release_meta.outputs.version }}' -VersionInfoVersion '${{ steps.release_meta.outputs.version_prefix }}.0' -IsccPath $env:INNO_SETUP_PATH
          $setupPath = Join-Path $releaseDir 'Nikkiward-Setup-win-x64.exe'
          if (-not (Test-Path -LiteralPath $setupPath -PathType Leaf)) {
            throw "Installer package is missing: $setupPath"
          }
          $manifestPath = Join-Path $releaseDir 'Nikkiward-update.json'
          .\build\New-UpdateManifest.ps1 -Version '${{ steps.release_meta.outputs.version }}' -Channel '${{ steps.release_meta.outputs.channel }}' -PackagePath $zipPath -Repository '${{ github.repository }}' -Tag '${{ steps.release_meta.outputs.tag }}' -CommitSha '${{ github.sha }}' -OutputPath $manifestPath
          $checksumPath = Join-Path $releaseDir 'SHA256SUMS.txt'
          $checksumLines = Get-ChildItem -LiteralPath $releaseDir -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines($checksumPath, $checksumLines, [System.Text.UTF8Encoding]::new($false))
          $verifyDir = Join-Path $env:RUNNER_TEMP 'nikkiward-release-verify'
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifyDir
          $zipManifestPath = Join-Path $env:RUNNER_TEMP 'nikkiward-zip.manifest.txt'
          .\build\Test-ReleasePayload.ps1 -Root $verifyDir -Label 'workflow ZIP' -ManifestPath $zipManifestPath
          $publishManifestPath = Join-Path $env:RUNNER_TEMP 'nikkiward-publish.manifest.txt'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $publishManifestPath).Hash -ne
              (Get-FileHash -Algorithm SHA256 -LiteralPath $zipManifestPath).Hash) {
            throw 'ZIP payload differs from the verified publish payload.'
          }

      - name: Test Windows installer
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'nikkiward-publish'
          $setupPath = Join-Path $env:RUNNER_TEMP 'nikkiward-release\Nikkiward-Setup-win-x64.exe'
          $testRoot = Join-Path $env:RUNNER_TEMP 'Nikkiward 安装验证\preview build'
          .\build\Test-Installer.ps1 -SetupPath $setupPath -PublishDir $publishDir -TestRoot $testRoot
          .\build\Test-Installer.ps1 -SetupPath $setupPath -PublishDir $publishDir -TestRoot $testRoot -UseDefaultInstallPath

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nikkiward-${{ steps.release_meta.outputs.version }}-win-x64
          path: ${{ runner.temp }}/nikkiward-release/*
          if-no-files-found: error

      - name: Create GitHub Release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release_meta.outputs.tag }}'
          $version = '${{ steps.release_meta.outputs.version }}'
          $assets = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'nikkiward-release') -File | ForEach-Object FullName
          $existingReleaseOutput = gh release view $tag --repo '${{ github.repository }}' 2>&1
          $existingReleaseExitCode = $LASTEXITCODE
          if ($existingReleaseExitCode -eq 0) {
            throw "Release already exists and is immutable: $tag"
          }
          if ($existingReleaseOutput -notmatch '(?i)release not found') {
            throw "Unable to prove that the release does not exist: $existingReleaseOutput"
          }
          $arguments = @('release', 'create', $tag) + $assets + @('--repo', '${{ github.repository }}', '--title', "Nikkiward $version", '--generate-notes', '--draft')
          if ('${{ steps.release_meta.outputs.channel }}' -eq 'preview') {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release draft creation failed with exit code $LASTEXITCODE."
          }
          Write-Output "RELEASE_DRAFT_CREATED tag=$tag version=$version"
