name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch verified native dependency
        shell: pwsh
        run: .\build\Fetch-Nuan5Dependency.ps1

      - name: Restore tests
        shell: pwsh
        run: dotnet restore .\Nikkiward.ProfileBuilder.Tests\Nikkiward.ProfileBuilder.Tests.csproj

      - name: Run tests
        shell: pwsh
        run: dotnet run --project .\Nikkiward.ProfileBuilder.Tests\Nikkiward.ProfileBuilder.Tests.csproj -c Release --no-restore

      - name: Restore WinUI app
        shell: pwsh
        run: dotnet restore .\Nikkiward\Nikkiward.csproj -r win-x64

      - name: Build WinUI app
        shell: pwsh
        run: dotnet build .\Nikkiward\Nikkiward.csproj -c Release -p:Platform=x64 -r win-x64 --no-restore --nologo
