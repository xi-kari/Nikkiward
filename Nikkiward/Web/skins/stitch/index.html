<!doctype html>
<html lang="zh-CN" data-skin="stitch">
<head>
<meta charset="utf-8">
<title>穿针引线</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; font-src 'self' file:; img-src 'self' https://still.nikkiward.invalid data: file:; media-src https://motion.nikkiward.invalid; base-uri 'none'; form-action 'none'; frame-src 'none'">
<link rel="stylesheet" href="../../fonts/fraunces.css">
<link rel="stylesheet" href="../../fonts/noto-serif-sc.css">
<link rel="stylesheet" href="../../fonts/zcool-xiaowei.css">
<link rel="stylesheet" href="home.css">
<script defer src="../../shared/home.js"></script>
<script defer src="home.js"></script>
<link rel="stylesheet" href="../../shared/theme.css"><link rel="stylesheet" href="../../shared/planner.css"><script defer src="../../shared/planner.js"></script>
</head>
<body>
<svg width="0" height="0" class="symbols" aria-hidden="true"><defs>
<symbol id="i-chev" viewBox="0 0 20 20"><path d="M5 8l5 5 5-5"/></symbol>
<symbol id="i-set" viewBox="0 0 20 20"><path d="M3 6h7M14 6h3M3 14h3M10 14h7"/><circle cx="12" cy="6" r="2"/><circle cx="8" cy="14" r="2"/></symbol>
<symbol id="i-ref" viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5V7h-3.5"/></symbol>
<symbol id="i-ck" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9"/></symbol>
<symbol id="i-fold" viewBox="0 0 20 20"><path d="M2.5 6V15.5h15V7.5H10L8 5H2.5z"/></symbol>
<symbol id="i-chan" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c3 3 3 11 0 14M10 3c-3 3-3 11 0 14"/></symbol>
<symbol id="i-shield" viewBox="0 0 20 20"><path d="M10 2.5l6 2.5v4.5c0 4-2.6 6.8-6 8-3.4-1.200-6-4-6-8V5z"/></symbol>
<symbol id="i-book" viewBox="0 0 20 20"><path d="M4 3.500h9a3 3 0 0 1 3 3V17H7a3 3 0 0 1-3-3zM4 14a3 3 0 0 1 3-3h9"/></symbol>
<symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></symbol>
<symbol id="i-task" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h8"/></symbol>
<symbol id="i-stop" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="2"/></symbol>
</defs></svg>


<div id="win" class="pending" data-screen="home" data-state="ready">
  <div class="art" aria-hidden="true"><img id="coverImg" alt=""><video id="coverVideo" muted loop playsinline hidden></video></div>
  <div class="hole"></div>

  <svg class="seam" viewBox="0 0 1440 810" aria-hidden="true">
    <defs><mask id="mk" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="810"><path id="rev" pathLength="1000" d="M1210 778H42A24 24 0 0 1 18 754V70A24 24 0 0 1 42 46H1398A24 24 0 0 1 1422 70V754A24 24 0 0 1 1398 778H1210"/></mask></defs>
    <path class="stitch" mask="url(#mk)" d="M1210 778H42A24 24 0 0 1 18 754V70A24 24 0 0 1 42 46H1398A24 24 0 0 1 1422 70V754A24 24 0 0 1 1398 778H1210"/>
    <path class="run" pathLength="1000" d="M1210 778H42A24 24 0 0 1 18 754V70A24 24 0 0 1 42 46H1398A24 24 0 0 1 1422 70V754A24 24 0 0 1 1398 778H1210"/>
    <g id="tack"><path class="bartack" d="M-13 46H13"/></g>
    <path class="tail" d="M1345 746C1346 768 1318 758 1296 778"/>
  </svg>
  <div class="needle" aria-hidden="true"><svg viewBox="0 0 54 8"><path d="M1 4C10 1.500 40 1.800 53 4 40 6.200 10 6.500 1 4z" class="metal"/><ellipse cx="9" cy="4" rx="4" ry="1" class="eye"/></svg></div>

  <header class="top">
    <div class="brand" title="Nikkiward · 非官方社区启动器">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18.500 3.500L7 15"/><path d="M5 17c-2-3 1-7 4-5s2 7-2 7c-3 0-4-3-4-6 0-5 4-9 9-9"/><circle cx="17.300" cy="4.700" r=".6" fill="currentColor"/></svg>
      Nikkiward
    </div>
    <nav class="nav" aria-label="主导航">
      <button data-action="nav-launcher" aria-current="page">启动</button><button data-action="nav-library">奇想手账</button><button data-action="nav-gallery">相册</button><button data-action="nav-gallery-favorites">收藏</button><button data-action="nav-resonance">心愿共鸣</button><button data-action="nav-settings">设置</button>
    </nav>
    <div class="drag"></div><button class="ibtn" id="btnTools" data-planner="reminder" aria-haspopup="dialog" aria-label="工具与提醒" title="工具与提醒"><svg class="i" viewBox="0 0 20 20"><path d="M7 3h6l-1 5 3 3H5l3-3zM10 11v6"/></svg></button>
  </header>

  <!-- ================= 首页 ================= -->
  <section class="scr" id="home" aria-label="启动">
    <button class="panel care sew" id="care" data-action="status" aria-label="状态，点击打开诊断">
      <h3>状态 <small>点开看明细</small></h3>
      <ul>
        <li><svg class="i"><use href="#i-chan"/></svg><span>渠道</span><em id="cChan"></em></li>
        <li id="cChkLi"><svg class="i"><use href="#i-shield"/></svg><span>启动检查</span><em id="cChk"></em></li>
        <li><svg class="i"><use href="#i-book"/></svg><span>手账时长</span><em id="official"></em></li>
        <li><svg class="i"><use href="#i-clock"/></svg><span>本机时长</span><em id="local"></em></li>
        <li><svg class="i"><use href="#i-task"/></svg><span>后台任务</span><em><span id="taskText"></span> <b class="num" id="progress"></b><i class="bar"></i></em></li>
      </ul>
    </button>

    <div class="panel recent sew" hidden>
      <header><h3>最近拍摄</h3><span></span><button class="lk" data-action="gallery">全部照片</button></header>
      <div class="shots" id="shots"></div>
    </div>

    <div id="backdrop" hidden></div>
    <div class="cluster">
      <div class="panel switcher" id="switcher" inert aria-modal="true" role="dialog" aria-label="切换档案">
        <header><h3>档案<small></small></h3><button class="btn sm" id="btnRediscover" data-action="rediscover"><svg class="i"><use href="#i-ref"/></svg>重新发现安装</button></header>
        <div role="radiogroup" aria-label="档案" id="profs"></div>
        <footer>切换档案不会移动或修改任何游戏文件。</footer>
      </div>
      <div class="cl-top sew">
        <button class="tag" id="btnProfile" aria-controls="switcher" aria-haspopup="dialog" aria-expanded="false"><i class="dot" id="pDot"></i><span id="pName"></span><small>Windows</small><svg class="i"><use href="#i-chev"/></svg></button>
        <span class="sp"></span>
        <button class="ibtn" id="btnConfig" data-action="settings" aria-label="游戏设置" title="游戏设置"><svg class="i"><use href="#i-set"/></svg></button>
      </div>
      <div class="note stitched" id="note" role="status">
        <p id="reason"></p>
        <div class="acts" id="actions">
          <span id="runningNote"></span>
          <button class="btn sm pri" data-action="locate"><svg class="i"><use href="#i-fold"/></svg>定位游戏</button>
          <button class="btn sm pri" data-action="recheck">重新检查</button>
          <button class="btn sm" data-action="status">查看检查明细</button>
          <button class="btn sm" data-action="rediscover">重新发现安装</button>
          <button class="btn sm" data-action="close"><svg class="i"><use href="#i-stop"/></svg><span></span></button>
        </div>
      </div>
      <button class="hero sew" id="hero" data-action="launch">
        <span class="tx"><b id="hT"></b><small id="hS"></small></span>
        <span class="disc" aria-hidden="true"><svg viewBox="0 0 66 66">
          <circle class="body" cx="33" cy="33" r="31"/><circle class="rim" cx="33" cy="33" r="23.500"/>
          <circle class="hl" cx="26" cy="26" r="4"/><circle class="hl" cx="40" cy="26" r="4"/><circle class="hl" cx="26" cy="40" r="4"/><circle class="hl" cx="40" cy="40" r="4"/>
          <g class="g-x"><path class="t" d="M26 26H40M26 40H40"/></g>
          <g class="g-par"><path class="t" d="M26 26H40M26 40H40"/><circle class="slit" cx="33" cy="33" r="27.500"/></g>
          <g class="g-cut"><path class="t" d="M26 26H40M26 40h4.500l2-4M40 40h-3l-1.500 3.500"/></g>
          <g class="g-spin"><circle cx="33" cy="33" r="27"/></g>
        </svg></span>
      </button>
    </div>
  </section>

  <footer class="hem">
    <span>底布</span><b id="bgName"></b><span class="pal" id="pal" title="从画面取到的线色"></span><span id="bgNote"></span>
    <button class="lk" id="btnBg" data-action="background">更换背景</button><button class="lk" id="btnBgReset" data-action="reset">恢复默认背景</button>
    <span class="sp"></span><span>非官方 · 社区项目</span>
  </footer>
</div>
</body></html>
